[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.github.tommyettinger:libgdx-utils-box2d:$utilsBox2dVersion"
  api "com.github.tommyettinger:libgdx-utils:$utilsVersion"
  api "org.mini2Dx:universal-tween-engine:$universalTweenVersion"
  api "com.kotcrab.vis:vis-ui:$visuiVersion"
  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"

  // Expose timecode runtime to consumers and IDE
  api project(":timecode-runtime")
  annotationProcessor project(":timecode-processor")

}

// Ensure generated sources are compiled and visible to downstream (e.g., GWT html)
sourceSets {
  main {
    java {
      srcDir "$buildDir/generated/sources/annotationProcessor/java/main"
    }
  }
}

// Help Android Studio/IntelliJ mark generated sources correctly
idea {
  module {
    def genDir = file("$buildDir/generated/sources/annotationProcessor/java/main")
    sourceDirs += genDir
    generatedSourceDirs += genDir
  }
}
